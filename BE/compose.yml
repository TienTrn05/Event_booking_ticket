name: eventix
services:
  redis:
    extends:
      file: compose.redis.yml
      service: redis
  elasticsearch:
    extends:
      file: compose.search.yml
      service: elasticsearch
  api:
    build: .
    image: eventix-api:local
    init: true
    env_file: .env
    environment:
      LOCAL_COMPOSE: 'true'
      HOST: 0.0.0.0
      PORT: '3000'
      DB_HOST: ${DOCKER_DB_HOST:-host.docker.internal}
      REDIS_URL: ${REDIS_URL:?Configure REDIS_URL in BE/.env}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: elastic
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD:?Run npm run search:setup first}
      ELASTICSEARCH_API_KEY:
      READINESS_REQUIRE_WORKERS: 'true'
      WORKER_HEALTH_DIRECTORY: /app/.local/worker-health
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 127.0.0.1:${DOCKER_API_PORT:-3000}:3000
    depends_on:
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, dist/runtime/healthcheck.js]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 12
    stop_grace_period: 30s
    restart: unless-stopped
    networks:
      - backend
networks:
  backend: {}
volumes:
  redis-data:
  elasticsearch-data:
